# Tiny CPU smoke test of the sweep machinery (5 symbols; see jobs/sweep_smoke.sh).
name: sweep_smoke
config: configs/backbone.yaml
tags: [smoke]
base:
  train.precision: fp32
  train.compile: false
  train.batch_size: 16
  train.total_steps: 60
  train.warmup_steps: 10
  train.log_every: 10
  train.eval_every: 20
  train.eval_windows: 64
  eval.save_points: true
runs:
  ref: {}
  hlgauss: {loss.hl_gauss_sigma: 0.117}
  nocal: {model.drop_features: [mod_sin, mod_cos, dow_sin, dow_cos], loss.ret_weights: [1.0, 1.0, 0.5, 0.25]}
