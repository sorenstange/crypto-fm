# Backbone v1 (M3 run cfm_bb_v1, accepted 2026-10-19) — frozen copy, also the base of the reg1–reg3 sweeps;
# the current default is configs/backbone.yaml (v2). Data/target definitions live in configs/data.yaml.

model:
  d_model: 256
  n_layers: 6
  n_heads: 4                 # head_dim 64
  mlp_hidden: 768            # SwiGLU
  dropout: 0.1
  rope_base: 10000.0
  drop_features: []          # input features zeroed (ablations), names from cfm.data.features.FEATURES

data:
  context_patches: 128       # 1,920 minutes
  warmup_patches: 96         # 1,440 minutes of segment history before a window may start
  symbol_weight_power: 0.5   # symbol sampling mass ~ (number of train windows)^power
  feature_dtype: float16     # features live on the GPU (~16 GB for train + val)
  build_workers: 4          # = cores requested in jobs/train.sh

loss:
  w_vol: 1.0
  z_loss: 1.0e-4
  ret_weights: [1.0, 1.0, 1.0, 1.0]   # per return horizon (h1, h5, h15, h60) in the training loss
  hl_gauss_sigma: 0.0        # > 0: HL-Gauss soft CE targets with this sigma (z units; bin width 0.156)

train:
  seed: 0
  lr: 1.0e-3
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.1          # not on norms, biases or the patch embedding
  warmup_steps: 1000
  total_steps: 20000
  decay_frac: 0.2            # WSD: linear decay over the last 20%
  batch_size: 256
  grad_clip: 1.0
  flip_prob: 0.0             # sign-flip augmentation: probability of mirroring a train window (cfm.data.augment)
  precision: bf16            # bf16 | fp16 (V100) | fp32
  compile: true
  log_every: 50
  eval_every: 500
  eval_windows: 2048         # fixed random subset of the validation windows for periodic eval
  early_stop_evals: 10       # stop after this many evals without a new best val loss
  ckpt_every_minutes: 20

eval:
  stride: 64                 # validation windows overlap by context - stride patches
  batch_size: 512
  save_points: false         # save per-point val losses (eval/val_points.npz) for cfm.eval.compare_runs
